<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Background Solid Squircle -->
  <rect width="128" height="128" rx="28" fill="#0f1117"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#262a36" stroke-width="2"/>

  <!-- 3D Isometric Polyhedral Cube (Solid Colors, No Gradients) -->
  <!-- Top Face -->
  <polygon points="64,22 102,44 64,66 26,44" fill="#6366f1" stroke="#818cf8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Right Face -->
  <polygon points="64,66 102,44 102,88 64,110" fill="#4338ca" stroke="#6366f1" stroke-width="2" stroke-linejoin="round"/>

  <!-- Left Face -->
  <polygon points="64,66 26,44 26,88 64,110" fill="#312e81" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round"/>

  <!-- Internal Coordinate Axes / Wireframe Struts -->
  <line x1="64" y1="66" x2="64" y2="40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="66" x2="84" y2="78" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="66" x2="44" y2="78" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Vertex Node Points (Solid) -->
  <circle cx="64" cy="22" r="4" fill="#ffffff"/>
  <circle cx="102" cy="44" r="3.5" fill="#a5b4fc"/>
  <circle cx="26" cy="44" r="3.5" fill="#a5b4fc"/>
  <circle cx="64" cy="66" r="4.5" fill="#ffffff"/>
  <circle cx="102" cy="88" r="3.5" fill="#a5b4fc"/>
  <circle cx="26" cy="88" r="3.5" fill="#a5b4fc"/>
  <circle cx="64" cy="110" r="4" fill="#818cf8"/>
</svg>
